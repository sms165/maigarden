<section class="contact-information-section" id="contact">
    <div class="contact-layout-container">
        
        <div class="contact-form-column">
            <h2 class="contact-main-title">Nachricht Senden</h2>
            
            <form class="contact-custom-form" onsubmit="event.preventDefault();">
                <div class="form-input-grid">
                    <div class="form-group-field">
                        <label for="contact-name">Name</label>
                        <input type="text" id="contact-name" placeholder="Ihr Name" required>
                    </div>
                    
                    <div class="form-group-field">
                        <label for="contact-email">E-mail</label>
                        <input type="email" id="contact-email" placeholder="ihre@email.de" required>
                    </div>
                    
                    <div class="form-group-field">
                        <label for="contact-phone">Telefon</label>
                        <input type="tel" id="contact-phone" placeholder="+49 ...">
                    </div>
                    
                    <div class="form-group-field">
                        <label for="contact-subject">Betreff</label>
                        <div class="select-wrapper">
                            <select id="contact-subject">
                                <option value="" disabled selected>Bitte wählen</option>
                                <option value="reservation">Reservierung</option>
                                <option value="event">Catering & Events</option>
                                <option value="feedback">Feedback</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="form-group-field full-width-field">
                    <label for="contact-message">Ihre Nachricht</label>
                    <textarea id="contact-message" placeholder="Wie können wir Ihnen helfen?" rows="5" required></textarea>
                </div>
                
                <button type="submit" class="contact-submit-action-btn">Nachricht Absenden</button>
            </form>
        </div>
        
        <div class="contact-vertical-divider"></div>
        
        <div class="contact-details-column">
            <div class="info-blocks-wrapper">
                
                <div class="info-details-block">
                    <h2 class="contact-main-title">Informationen</h2>
                    
                    <div class="meta-info-item">
                        <span class="meta-icon location-icon"></span>
                        <div class="meta-text">
                            <h3>Adresse</h3>
                            <p>Herrenstrasse 23<br>76133 Karlsruhe</p>
                        </div>
                    </div>
                    
                    <div class="meta-info-item">
                        <span class="meta-icon phone-icon"></span>
                        <div class="meta-text">
                            <h3>Telefon</h3>
                            <p>+49 0721 95965379</p>
                        </div>
                    </div>
                    
                    <div class="meta-info-item">
                        <span class="meta-icon email-icon"></span>
                        <div class="meta-text">
                            <h3>E-mail</h3>
                            <p>info@maigarden.de</p>
                        </div>
                    </div>
                </div>
                
                <div class="info-hours-block">
                    <h2 class="contact-main-title">Öffnungszeiten</h2>
                    
                    <div class="hours-schedule-row">
                        <span class="days">Sonntag - Donnerstag</span>
                        <span class="time-range">11:30 - 22:30</span>
                    </div>
                    
                    <div class="hours-schedule-row">
                        <span class="days">Freitag - Samstag</span>
                        <span class="time-range">11:30 - 23:00</span>
                    </div>
                </div>
                
            </div>
            
            <div class="google-map-outer-frame">
                <div class="map-corner-accent top-left"></div>
                <div class="map-corner-accent top-right"></div>
                <div class="map-corner-accent bottom-left"></div>
                <div class="map-corner-accent bottom-right"></div>
                
                <div class="map-inner-canvas">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2638.163456847849!2d8.3976822!3d49.0093121!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4797074acdf776c5%3A0x6b80be0e8df9911e!2sHerrenstra%C3%9Fe%2023%2C%2076133%20Karlsruhe!5e0!3m2!1sde!2sde!4v1719390000000!5m2!1sde!2sde" 
                        width="100%" 
                        height="100%" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
            
        </div>
        
    </div>
</section>
